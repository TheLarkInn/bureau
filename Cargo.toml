[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
categories = ["development-tools"]
description = "Tools for organizing coding agents"
edition = "2024"
keywords = ["agents", "automation"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheLarkInn/bureau"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/li-kai/rust-lints", rev = "3e4427e520f87f638e8b4cc1926cc641fe93d6c8" },
]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# `deny` fails CI on any hand-written `#[allow]`; `forbid` would also
# break spec-approved derive macros (clap) whose expansions contain one.
allow_attributes = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"

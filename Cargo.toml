[workspace]
members = [".github/extensions/bureau-canvas", "crates/*"]
default-members = [".github/extensions/bureau-canvas", "crates/*"]
resolver = "3"

[workspace.package]
categories = ["development-tools"]
description = "Tools for organizing coding agents"
edition = "2024"
keywords = ["agents", "automation"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheLarkInn/bureau"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", default-features = false }
# `bureau watch`: the ecosystem-standard TUI stack; crossterm comes
# through ratatui's re-export so exactly one version is linked.
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[workspace.metadata.dylint]
# Vendored copy of https://github.com/li-kai/rust-lints @ 3e4427e with one
# patch: module_dependencies dead-edge detection only fires when both endpoint
# modules exist in the crate being linted, so this single workspace-wide
# dylint.toml can declare every crate's module graph.
libraries = [{ path = "lints/rust-lints" }]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# `deny` fails CI on any hand-written `#[allow]`; `forbid` would also
# break spec-approved derive macros (clap) whose expansions contain one.
allow_attributes = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
# Unsatisfiable with the spec's approved dependency set: reqwest's own
# tree pulls syn 2 (synstructure) and syn 3 (displaydoc). The rest of the
# `cargo` group stays denied.
multiple_crate_versions = "allow"

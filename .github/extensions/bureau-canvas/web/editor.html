<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bureau — pipeline editor</title>
    <!-- Same vendored modules as index.html; keep the two import maps in lockstep. -->
    <link rel="stylesheet" href="./vendor/xyflow-react.css" />
    <link rel="stylesheet" href="./controls.css" />
    <link rel="stylesheet" href="./relation.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.mjs",
          "react/jsx-runtime": "./vendor/react-jsx-runtime.mjs",
          "react-dom": "./vendor/react-dom.mjs",
          "react-dom/client": "./vendor/react-dom-client.mjs",
          "@xyflow/react": "./vendor/xyflow-react.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --radius: 0.625rem;
        --kind-deterministic: var(--true-color-blue, #0969da);
        --kind-agent: var(--true-color-purple, #8250df);
        --kind-decision: var(--true-color-yellow, #9a6700);
        --kind-concurrent: var(--true-color-green, #1a7f37);
        --outcome-success: var(--true-color-green, #1a7f37);
        --outcome-failure: var(--true-color-red, #cf222e);
        --outcome-blocked: var(--true-color-yellow, #9a6700);
        --outcome-no-work: var(--text-color-muted, #656d76);
        --surface-subtle: #f6f8fa;
        --surface-hover: #eaeef2;
        --surface-active: #d0d7de;
        --finding-validation: var(--true-color-red-muted, #ffebe9);
        --finding-advisory: var(--true-color-yellow-muted, #fff8c5);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: var(--text-body-medium, 14px);
        line-height: var(--leading-body-medium, 20px);
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: var(--text-title-large, 1.25rem); line-height: 1.5rem; font-weight: 700; }
      h2 { font-size: var(--text-title-medium, 1rem); line-height: 1.25rem; font-weight: 700; }
      h3 {
        color: var(--text-color-muted, #656d76);
        font-size: 0.78rem;
        line-height: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .app-shell { display: flex; flex-direction: column; height: 100vh; background: var(--background-color-default, #ffffff); }
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-5);
        border-bottom: 1px solid var(--border-color-default, #d0d7de);
      }
      .editor-heading { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
      .summary, .muted { color: var(--text-color-muted, #656d76); }
      .editor-tabs {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 8px;
        background: var(--surface-subtle);
      }
      .editor-tab {
        padding: 4px 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-color-muted, #656d76);
        cursor: pointer;
      }
      .editor-tab.is-active {
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
      }
      .editor-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .editor-view { display: flex; flex: 1; min-height: 0; }
      .editor-view[hidden] { display: none; }
      .editor-toolbar {
        display: grid;
        grid-template-columns: minmax(8rem, 1fr) auto auto auto auto;
        gap: var(--space-3);
        align-items: center;
        padding: var(--space-3) var(--space-5);
        border-bottom: 1px solid var(--border-color-default, #d0d7de);
      }
      .editor-toolbar-add { display: flex; align-items: center; gap: var(--space-2); }
      .editor-toolbar-actions { display: flex; align-items: center; gap: var(--space-3); justify-self: end; }
      .editor-toolbar-title { display: flex; align-items: center; gap: var(--space-3); }
      .editor-surface-switcher {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
      }
      .editor-surface-tab {
        border: 0;
        padding: var(--space-1) var(--space-2);
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-muted, #656d76);
        cursor: pointer;
        text-transform: capitalize;
      }
      .editor-surface-tab.is-active {
        background: var(--surface-active);
        color: var(--text-color-default, #1f2328);
        font-weight: 600;
      }
      .editor-status { color: var(--text-color-muted, #656d76); white-space: nowrap; }
      .editor-status--hints { color: var(--outcome-blocked); }
      /*
       * A refused write is not a status. Muted grey put "save reverted" in the
       * same treatment as "saved" and "unsaved edits", so the one word in the
       * toolbar that reports a failure read like the two that report calm.
       * Every other refusal in the canvas — the draft bar, all five field
       * editors, the run controls — is drawn in the failure colour, and this is
       * the same event.
       */
      .editor-status--error { color: var(--outcome-failure); font-weight: 600; }
      .editor-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 20rem;
        flex: 1;
        min-height: 0;
      }
      .editor-flow { min-width: 0; min-height: 0; background: var(--background-color-default, #ffffff); }
      .transition-editor {
        min-width: 0;
        overflow: auto;
        background: var(--background-color-default, #ffffff);
      }
      .transition-table {
        width: 100%;
        min-width: 54rem;
        border-collapse: collapse;
      }
      .transition-table th,
      .transition-table td {
        padding: var(--space-2);
        border-right: 1px solid var(--border-color-default, #d0d7de);
        border-bottom: 1px solid var(--border-color-default, #d0d7de);
        text-align: left;
        vertical-align: middle;
      }
      .transition-table th:last-child,
      .transition-table td:last-child { border-right: 0; }
      .transition-table thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--surface-subtle);
        color: var(--text-color-muted, #656d76);
        font-size: var(--text-code-inline, 12px);
        text-transform: capitalize;
      }
      .transition-table tbody th {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 13rem;
        background: var(--background-color-default, #ffffff);
      }
      .transition-row {
        --row-accent: var(--text-color-muted, #656d76);
        cursor: pointer;
      }
      .transition-row--deterministic { --row-accent: var(--kind-deterministic); }
      .transition-row--agent { --row-accent: var(--kind-agent); }
      .transition-row--decision { --row-accent: var(--kind-decision); }
      .transition-row--concurrent { --row-accent: var(--kind-concurrent); }
      .transition-row th:first-child {
        border-left: 4px solid var(--row-accent);
      }
      .transition-row:hover th,
      .transition-row:hover td,
      .transition-row.is-selected th,
      .transition-row.is-selected td {
        background: var(--surface-subtle);
      }
      .transition-step {
        display: grid;
        grid-template-columns: 1.5rem minmax(0, 1fr);
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .transition-index {
        color: var(--text-color-muted, #656d76);
        font: 600 var(--text-code-inline, 12px)/1 var(--font-mono, "SFMono-Regular", Consolas, monospace);
      }
      .transition-step strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .transition-select { min-width: 9rem; }
      .editor-panel {
        min-width: 0;
        overflow-y: auto;
        padding: var(--space-4);
        border-left: 1px solid var(--border-color-default, #d0d7de);
        background: var(--surface-subtle);
      }
      .panel-section { display: grid; gap: var(--space-3); margin-bottom: var(--space-5); }
      .editor-empty { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
      .editor-legend {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--text-color-muted, #656d76);
        font-size: 11px;
      }
      .legend-swatch { display: inline-flex; align-items: center; gap: 4px; }
      .legend-swatch::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--text-color-muted, #656d76);
        content: "";
      }
      .legend-swatch--success::before { background: var(--outcome-success); }
      .legend-swatch--failure::before { background: var(--outcome-failure); }
      .legend-swatch--blocked::before { background: var(--outcome-blocked); }
      .legend-swatch--data::before { background: var(--relation-data); }
      .editor-edges .editor-check {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: var(--space-2);
      }
      .editor-check input { margin: 0; }
      .editor-issues button {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .editor-issues button:hover { text-decoration: underline; }
      .editor-card {
        width: 15rem;
        min-height: 7rem;
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-top: 4px solid var(--accent, var(--text-color-muted, #656d76));
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }
      .editor-card h2 { font-size: 1rem; }
      .editor-card .detail {
        overflow: hidden;
        color: var(--text-color-muted, #656d76);
        font-family: var(--font-mono, "SFMono-Regular", Consolas, monospace);
        font-size: var(--text-code-inline, 12px);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kind-label {
        justify-self: start;
        padding: 2px 10px;
        border-radius: 999px;
        /*
         * `--accent` is set by the node card a kind badge usually sits in.
         * The side panel is not a node card, so the badge there rendered
         * white-on-white until it carried its own kind modifier; the fallback
         * keeps any future placement legible rather than invisible.
         */
        background: var(--accent, var(--text-color-muted, #656d76));
        color: var(--color-white, #ffffff);
        font-size: var(--text-code-inline, 12px);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .kind-label--deterministic { --accent: var(--kind-deterministic); }
      .kind-label--agent { --accent: var(--kind-agent); }
      .kind-label--decision { --accent: var(--kind-decision); }
      .kind-label--concurrent { --accent: var(--kind-concurrent); }
      .editor-card--deterministic { --accent: var(--kind-deterministic); }
      .editor-card--agent { --accent: var(--kind-agent); }
      .editor-card--decision { --accent: var(--kind-decision); border-style: dashed; border-width: 2px; }
      .editor-card--concurrent { --accent: var(--kind-concurrent); }
      .editor-card--hint { outline: 2px solid var(--outcome-blocked); outline-offset: 2px; }
      .editor-card__issue-count {
        justify-self: start;
        padding: 0.125rem 0.5rem;
        border: 1px solid var(--outcome-blocked);
        border-radius: 999px;
        color: var(--outcome-blocked);
        font-size: var(--text-code-inline, 12px);
      }
      .editor-terminal {
        width: 11rem;
        display: grid;
        gap: 2px;
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        text-align: left;
      }
      .editor-terminal h2 { font-size: 1rem; }
      .editor-terminal p { color: var(--text-color-muted, #656d76); font-size: var(--text-code-inline, 12px); }
      .editor-terminal--done { border-top: 3px solid var(--outcome-success); }
      .editor-terminal--abort { border-top: 3px solid var(--outcome-failure); }
      .editor-terminal--escalate { border-top: 3px solid var(--outcome-blocked); }
      .editor-handle { width: 0.65rem; height: 0.65rem; }
      .editor-handle--success { background: var(--outcome-success); }
      .editor-handle--failure { background: var(--outcome-failure); }
      .editor-handle--blocked { background: var(--outcome-blocked); }
      .editor-handle--no-work { background: var(--outcome-no-work); }
      .editor-handle--data { background: var(--kind-deterministic); }
      .editor-handle--observes { background: var(--kind-agent); }
      .editor-edge--success .react-flow__edge-path { stroke: var(--outcome-success); }
      .editor-edge--failure .react-flow__edge-path { stroke: var(--outcome-failure); }
      .editor-edge--blocked .react-flow__edge-path { stroke: var(--outcome-blocked); }
      .editor-edge--no-work .react-flow__edge-path { stroke: var(--outcome-no-work); }
      .editor-edge--data .react-flow__edge-path { stroke: var(--kind-deterministic); stroke-dasharray: 6 4; }
      .editor-edge--observes .react-flow__edge-path { stroke: var(--kind-agent); stroke-dasharray: 6 4; }
      .editor-issues {
        display: grid;
        gap: var(--space-2);
        margin: 0;
        padding-left: var(--space-4);
        color: var(--outcome-blocked);
        font-size: var(--text-code-inline, 12px);
      }
      /*
       * The reverted list is a refusal, not advice. It shares `.editor-issues`
       * with the hint list, which is drawn in the blocked colour because a hint
       * is something to consider; a write the host turned away is something
       * that happened, and it reads in the failure colour like every other one.
       */
      .editor-save-reverted .editor-issues { color: var(--outcome-failure); }
      .editor-step label, .editor-edges label {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        margin-bottom: var(--space-2);
        color: var(--text-color-muted, #656d76);
        font-size: var(--text-code-inline, 12px);
      }
      .editor-step-head { display: flex; justify-content: space-between; align-items: center; }
      .editor-edges {
        margin: 0 0 var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
      }
      .editor-edges legend { padding: 0 var(--space-1); color: var(--text-color-muted, #656d76); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      .editor-textarea { min-height: 5rem; resize: vertical; }
      .editor-danger-zone {
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--outcome-failure);
        border-radius: 6px;
        background: var(--finding-validation);
        color: var(--outcome-failure);
        font-size: var(--text-code-inline, 12px);
      }
      .editor-danger-actions { display: flex; gap: var(--space-2); }
      @media (max-width: 56rem) {
        .editor-legend,
        .react-flow__minimap { display: none; }
      }
      .edge-caption {
        position: absolute;
        width: max-content;
        padding: 1px var(--space-1);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-muted, #656d76);
        font-size: var(--text-code-inline, 12px);
        pointer-events: none;
      }
      .is-highlighted { outline: 2px solid var(--kind-deterministic); outline-offset: 2px; }
      @media (max-width: 56rem) {
        /*
         * Below the breakpoint the side panel stops being a column and
         * becomes a row under the graph. Keeping two columns here left the
         * drawing about 30rem wide — a strip too narrow to read a pipeline
         * in, which is the one thing this surface exists for. The panel row
         * takes the remaining height with `minmax(0, 1fr)` so its own
         * `overflow-y: auto` still applies inside the 100vh shell.
         */
        .editor-main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 26rem minmax(0, 1fr);
        }
        .editor-panel { border-left: 0; border-top: 1px solid var(--border-color-default, #d0d7de); }
        .editor-toolbar { grid-template-columns: minmax(10rem, 1fr) auto; justify-items: start; }
      }

      /*
       * The same recovery surface index.html draws, because it is the same
       * failure: the renderer modules did not load. Rendering the matrix side
       * by side showed the editor answering that with a bare stack trace on a
       * blank page — no title, no cause, and no way back to the landing this
       * surface was opened from. A sub-surface that can strand you is worse
       * than the one that cannot, so both now fail the same way.
       */
      .fallback-shell {
        display: grid;
        gap: var(--space-4);
        max-width: 52rem;
        margin: var(--space-5);
        padding: var(--space-5);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }

      .fallback-error {
        white-space: pre-wrap;
        color: var(--outcome-failure);
      }

      .fallback-state {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: var(--space-2) var(--space-3);
      }

      .fallback-state dt { color: var(--text-color-muted, #656d76); }
      .fallback-state dd { margin: 0; }
      .fallback-actions { display: flex; gap: var(--space-2); }
    </style>
  </head>
  <body>
    <div id="editor-root"></div>
    <script type="module">
      const root = document.querySelector("#editor-root");
      let rendered = false;
      window.addEventListener("error", (event) => {
        void showFallback(event.error ?? event.message);
      });
      try {
        await import("./editor/index.mjs");
      } catch (error) {
        await showFallback(error);
      }

      /*
       * editor.html is a sub-surface: it is always opened from the assignment
       * landing. So its boot failure owes the reader the same three things the
       * landing's does — what broke, what is still known, and the way back —
       * and the way back matters more here, because this page has no other
       * navigation once the renderer is gone.
       */
      async function showFallback(error) {
        if (rendered || window.__bureauEditorMounted) {
          return;
        }
        rendered = true;
        root.replaceChildren(fallbackView(error, await loadState()));
      }

      async function loadState() {
        try {
          const response = await fetch("./state", { cache: "no-store" });
          return response.ok ? await response.json() : { status: `State request failed: ${response.status}` };
        } catch (stateError) {
          return { status: "State unavailable", validation: { message: String(stateError) } };
        }
      }

      function fallbackView(error, state) {
        const shell = document.createElement("main");
        shell.className = "fallback-shell";
        shell.append(heading(), errorText(error), stateList(state), actions());
        return shell;
      }

      function heading() {
        const block = document.createElement("div");
        const title = document.createElement("h1");
        const copy = document.createElement("p");
        title.textContent = "Pipeline editor could not start";
        copy.className = "muted";
        copy.textContent = "The pipeline is unchanged on disk. Check whether the CDN, proxy, or import map blocked the renderer modules.";
        block.append(title, copy);
        return block;
      }

      function errorText(error) {
        const message = document.createElement("p");
        message.className = "fallback-error";
        message.textContent = error?.stack || error?.message || String(error);
        return message;
      }

      function stateList(state) {
        const list = document.createElement("dl");
        list.className = "fallback-state";
        addPair(list, "Status", state.status ?? state.validation?.state ?? "unknown");
        addPair(list, "Pipeline", state.selectedPipeline?.name ?? "none selected");
        addPair(list, "Config dir", state.validation?.dir ?? state.dir ?? "unknown");
        return list;
      }

      function addPair(list, label, value) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = label;
        detail.textContent = value;
        list.append(term, detail);
      }

      /*
       * The same escape the working header offers, under the same test id,
       * because it is the same control. Nothing is unsaved here — the editor
       * never mounted — so it leaves without asking, and it navigates even when
       * telling the host went wrong: a broken page must not also be a trap.
       */
      function actions() {
        const row = document.createElement("div");
        const back = document.createElement("button");
        row.className = "fallback-actions";
        back.type = "button";
        back.className = "btn btn--small";
        back.dataset.testid = "editor-back";
        back.textContent = "← Assignments";
        back.addEventListener("click", () => void backToAssignments());
        row.append(back);
        return row;
      }

      async function backToAssignments() {
        try {
          await fetch("./intent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kind: "back-to-config" }),
          });
        } catch {
          // The host may be why this page is broken; leaving still has to work.
        }
        window.location.assign("./");
      }
    </script>
  </body>
</html>

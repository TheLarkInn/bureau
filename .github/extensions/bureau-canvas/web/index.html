<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bureau</title>
    <!-- Module URLs are pinned here; keep the stylesheet version below in lockstep because CSS links cannot use import-map aliases. -->
    <link rel="stylesheet" href="./vendor/xyflow-react.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.mjs",
          "react/jsx-runtime": "./vendor/react-jsx-runtime.mjs",
          "react-dom": "./vendor/react-dom.mjs",
          "react-dom/client": "./vendor/react-dom-client.mjs",
          "@xyflow/react": "./vendor/xyflow-react.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --radius: 0.625rem;
        --card-width: 15rem;
        --kind-work-source: var(--text-color-muted, #656d76);
        --kind-assignment: var(--true-color-blue, #0969da);
        --kind-role: var(--true-color-purple, #8250df);
        --kind-repo: var(--true-color-green, #1a7f37);
        --kind-pipeline: var(--true-color-yellow, #9a6700);
        --kind-deterministic: var(--true-color-blue, #0969da);
        --kind-agent: var(--true-color-purple, #8250df);
        --kind-decision: var(--true-color-yellow, #9a6700);
        --kind-concurrent: var(--true-color-green, #1a7f37);
        --kind-terminal: var(--text-color-muted, #656d76);
        --outcome-success: var(--true-color-green, #1a7f37);
        --outcome-failure: var(--true-color-red, #cf222e);
        --outcome-blocked: var(--true-color-yellow, #9a6700);
        --outcome-no-work: var(--text-color-muted, #656d76);
        --relation-data: var(--true-color-blue, #0969da);
        --relation-observes: var(--true-color-purple, #8250df);
        --finding-validation: var(--true-color-red-muted, #ffebe9);
        --finding-advisory: var(--true-color-yellow-muted, #fff8c5);
      }

      body {
        margin: 0;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: var(--text-body-medium, 14px);
        line-height: var(--leading-body-medium, 20px);
      }

      button { font: inherit; }

      h1, h2, h3, p { margin: 0; }

      h1 {
        font-size: 1.25rem;
        line-height: 1.5rem;
        font-weight: 700;
      }

      h2 {
        font-size: 1rem;
        line-height: 1.25rem;
        font-weight: 700;
      }

      h3 {
        font-size: 0.78rem;
        line-height: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-color-muted, #656d76);
        font-weight: 700;
      }

      code, .mono {
        font-family: var(--font-mono, "SFMono-Regular", Consolas, "Liberation Mono", monospace);
        font-size: var(--text-code-inline, 12px);
      }

      .app-shell {
        /* Flex rather than fixed grid rows: the draft bar appears and
           disappears, and a fixed `1fr` row stretched whichever child landed
           in it. */
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--background-color-default, #ffffff);
      }

      .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;        gap: var(--space-5);
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--border-color-default, #d0d7de);
      }

      .summary, .muted, .detail {
        color: var(--text-color-muted, #656d76);
      }

      .status {
        display: grid;
        gap: var(--space-1);
        max-width: 40rem;
        text-align: right;
        color: var(--text-color-muted, #656d76);
      }

      .findings, .chips, .step-list, .legend {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      /* Chips carry names that can be long; clip with an ellipsis rather than
         letting them run past the card the layout reserved room for. */
      .chips > *, .step-list > * {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .create-bar, .draft-bar {
        margin-left: var(--space-5);
        margin-right: var(--space-5);
      }

      .general-findings {
        padding: var(--space-3) var(--space-5) 0;
      }

      .chip, .finding, .step-badge, .legend-item {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        white-space: nowrap;
      }

      .finding--validation { background: var(--finding-validation); }
      .finding--advisory { background: var(--finding-advisory); }

      .view-shell {
        display: grid;
        gap: var(--space-4);
        padding: var(--space-5);
        flex: 1 1 auto;
        min-height: 0;
      }

      .view-shell--pipeline {
        grid-template-columns: minmax(50rem, 1fr) 19rem;
        min-height: 0;
      }

      .surface {
        position: relative;
        min-height: 42rem;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        overflow: auto;
      }

      .config-surface {
        min-width: max-content;
      }

      .edge-layer, .card-layer {
        position: absolute;
        inset: 0;
      }

      .edge-layer { pointer-events: none; }

      .edge-path {
        fill: none;
        stroke: var(--border-color-default, #d0d7de);
        stroke-width: 2;
      }

      .card, .flow-card {
        box-sizing: border-box;
        display: grid;
        gap: var(--space-2);
        width: var(--card-width);
        min-height: 7rem;
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-top: 4px solid var(--accent, var(--kind-terminal));
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 240px;
        overflow: hidden;
      }
      .card > div,
      .card > .card-button {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      /* Same surface as the pipeline view: pan, zoom, fit, minimap. */
      .config-flow {
        min-height: 44rem;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        overflow: hidden;
      }
      /* A pending change must not look like saved state. */
      .draft-bar {
        margin: 0 0 12px;
        padding: 10px 14px;
        border: 1px dashed var(--true-color-orange, #cca700);
        border-radius: 8px;
        background: var(--background-color-default, #fff);
      }
      .draft-bar p {
        margin: 0 0 6px;
        font-weight: var(--font-weight-semibold, 600);
      }
      .draft-list {
        margin: 0 0 8px;
        padding-left: 18px;
        color: var(--text-color-muted, #656d76);
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
      }
      .draft-actions button,
      .create-bar button,
      .card-action,
      .preflight button {
        padding: 5px 12px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        color: var(--text-color-default, #1f2328);
        font: inherit;
        font-size: var(--text-code-inline, 12px);
        line-height: 1.4;
        cursor: pointer;
      }
      .draft-actions button:hover,
      .create-bar button:hover,
      .card-action:hover,
      .preflight button:hover {
        border-color: var(--text-color-muted, #656d76);
      }
      .draft-actions button + button,
      .preflight button + button {
        margin-left: 6px;
      }
      .card-action {
        align-self: flex-end;
        flex: 0 0 auto;
        margin: 6px 0 0;
        color: var(--text-color-muted, #656d76);
      }
      .create-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
      }
      .create-bar select,
      .create-bar input {
        height: 30px;
        padding: 4px 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        color: var(--text-color-default, #1f2328);
        font: inherit;
      }
      .card-action {
        display: block;
        margin: 8px 0 0 auto;
        font-size: var(--text-code-inline, 12px);
      }
      .preflight {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        font-size: var(--text-code-inline, 12px);
      }
      /* Friction proportional to consequence: a referenced delete reads louder. */
      .preflight--blocking {
        border-color: var(--true-color-red, #cf222e);
      }
      .preflight ul {
        margin: 4px 0 8px;
        padding-left: 16px;
        color: var(--text-color-muted, #656d76);
      }
      .severity-entry-step {
        color: var(--true-color-red, #cf222e);
        font-weight: var(--font-weight-semibold, 600);
      }

      .card-button, .step-button, .back-button {
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .back-button {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: var(--space-1) var(--space-3);
        background: var(--background-color-default, #ffffff);
      }

      .card-button, .step-button {
        display: grid;
        gap: var(--space-2);
        width: 100%;
        padding: 0;
      }

      .card-button:focus-visible, .step-button:focus-visible, .back-button:focus-visible, .permission-chip:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }

      .card--work-source { --accent: var(--kind-work-source); }
      .card--assignment { --accent: var(--kind-assignment); }
      .card--role { --accent: var(--kind-role); }
      .card--repo { --accent: var(--kind-repo); }
      .card--pipeline { --accent: var(--kind-pipeline); }
      .card--orphan { outline: 1px dashed var(--border-color-default, #d0d7de); outline-offset: 4px; }

      .kind-label {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-color-muted, #656d76);
      }

      .detail {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The detail is a button so a long value is readable, not just hinted at
         by a native tooltip nobody waits for. */
      .detail-toggle {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .detail-toggle:hover,
      .detail-toggle:focus-visible {
        color: var(--text-color-default, #1f2328);
        text-decoration: underline dotted;
      }
      .detail-toggle--open {
        overflow: visible;
        white-space: normal;
        word-break: break-word;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
      }
      /* An expanded card grows past its reserved box and floats above the rest
         rather than shoving its neighbours around. */
      .card--expanded {
        height: auto;
        overflow: visible;
        box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
      }
      .card--expanded > div,
      .card--expanded > .card-button {
        overflow: visible;
      }

      /* Assignment-first landing: a vertical stack of cards, flat on the
         bench (no resting shadow per the Flat Bench rule). */
      .view-shell--config {
        align-content: start;
        max-width: 56rem;
      }
      .config-heading {
        font-size: 1rem;
        font-weight: 700;
      }
      .assignment-stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .assignment-card {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-top: 4px solid var(--kind-assignment);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }
      .assignment-head {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "kind name" "glance glance";
        column-gap: var(--space-3);
        row-gap: var(--space-1);
        width: 100%;
        padding: var(--space-3);
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .assignment-head .kind-label { grid-area: kind; }
      .assignment-head .assignment-name {
        grid-area: name;
        font-weight: 700;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-default, #1f2328);
      }
      .assignment-head .assignment-glance {
        grid-area: glance;
        color: var(--text-color-muted, #656d76);
        font-size: var(--text-code-inline, 12px);
      }
      .assignment-head:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }
      .assignment-detail {
        display: grid;
        gap: var(--space-2);
        padding: 0 var(--space-3) var(--space-3);
      }
      .detail-row {
        display: grid;
        grid-template-columns: 7.5rem 1fr;
        gap: var(--space-3);
        align-items: start;
      }
      .detail-label {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-color-muted, #656d76);
      }
      .detail-value { min-width: 0; }
      .detail-value code { word-break: break-word; }
      .ref {
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
      }
      .ref--role { color: var(--kind-role); }
      .ref--pipeline { color: var(--kind-pipeline); }
      .ref-link {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .repo-chip { border-color: var(--kind-repo); }
      .orphan-strip {
        border: 1px dashed var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        padding: var(--space-3);
      }
      .orphan-strip h3 { margin-bottom: var(--space-2); }
      .orphan-chip--repo { border-color: var(--kind-repo); }
      .orphan-chip--role { border-color: var(--kind-role); }
      .orphan-chip--pipeline { border-color: var(--kind-pipeline); }
      /* Work source: paste a board or issues URL and confirm what it derives. */
      .ws-value {
        border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-default, #1f2328);
        text-decoration: underline dotted var(--text-color-muted, #656d76);
        text-underline-offset: 3px;
      }
      .ws-value:hover { color: var(--kind-assignment); text-decoration-color: var(--kind-assignment); }
      .ws-value:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }
      .ws-open {
        display: grid;
        gap: var(--space-3);
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
      }
      .paste-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
      }
      .paste-input:focus {
        outline: 0;
        border-color: var(--kind-assignment);
        box-shadow: 0 0 0 1px var(--kind-assignment);
      }
      .derived {
        display: grid;
        gap: var(--space-2);
        border-top: 1px solid var(--border-color-default, #d0d7de);
        padding-top: var(--space-3);
      }
      .derived-row {
        display: grid;
        grid-template-columns: 4rem 1fr;
        gap: var(--space-3);
        align-items: start;
      }
      .derived-row code { word-break: break-word; }
      .pill {
        justify-self: start;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
      }
      .pill--github { border-color: var(--kind-assignment); color: var(--kind-assignment); }
      .pill--ado { border-color: var(--kind-role); color: var(--kind-role); }
      .note { font-size: var(--text-code-inline, 12px); color: var(--text-color-muted, #656d76); }
      .note--warn { color: var(--kind-pipeline); }
      .note--err { color: var(--outcome-failure); }
      .btn {
        padding: 5px 12px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-size: var(--text-code-inline, 12px);
        cursor: pointer;
      }
      .btn:hover:not(:disabled) { border-color: var(--text-color-muted, #656d76); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn--primary {
        background: var(--kind-assignment);
        border-color: var(--kind-assignment);
        color: var(--color-white, #ffffff);
      }
      .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }

      /* Role: a capability summary that opens into a picker or a new role. */
      .rolebox {
        width: 100%;
        display: grid;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        /* An inner control steps down from the card radius. */
        border-radius: 6px;
        background: none;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .rolebox:hover { border-color: var(--kind-role); }
      .rolebox:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }
      .rolebox-top { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
      .rolename {
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--kind-role);
      }
      .role-editor {
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
      }
      .role-preview {
        display: grid;
        gap: var(--space-2);
        border-top: 1px solid var(--border-color-default, #d0d7de);
        padding-top: var(--space-2);
      }
      /* These rows sit one level inside an assignment row, so their label
         column steps down the way `.derived-row` does. */
      .role-editor .detail-row,
      .role-preview .detail-row {
        grid-template-columns: 4rem 1fr;
      }
      .role-editor .detail-value,
      .role-preview .detail-value { min-width: 0; }
      .role-select, .role-input {
        width: 100%;
        padding: 5px 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-size: var(--text-code-inline, 12px);
      }
      .role-input { font-family: var(--font-mono, monospace); }
      .role-select:focus, .role-input:focus {
        outline: 0;
        border-color: var(--kind-assignment);
        box-shadow: 0 0 0 1px var(--kind-assignment);
      }
      /* A constant annotation, so Bench Gray rather than a tint of its own. */
      .trust {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0 0.45rem;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-muted, #656d76);
      }
      .perm {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-muted, #656d76);
        white-space: nowrap;
      }
      .perm--write { border-color: var(--kind-pipeline); color: var(--kind-pipeline); }
      /* Elevated past write. Same "judgment required" hue rather than the
         failure red, which names a failed outcome; the fill carries the
         escalation so no second meaning is borrowed. */
      .perm--push {
        border-color: var(--kind-pipeline);
        background: var(--kind-pipeline);
        color: var(--color-white, #ffffff);
      }
      .perm--model { border-color: var(--kind-role); color: var(--kind-role); }
      .perm-grid { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .perm-toggle {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-muted, #656d76);
        background: none;
        white-space: nowrap;
        cursor: pointer;
      }
      /* Selection adds a fill, so it never rests on hue alone, and each grade
         keeps the colour its saved chip uses. */
      .perm-toggle[aria-pressed="true"] {
        color: var(--text-color-default, #1f2328);
        background: color-mix(in srgb, var(--text-color-muted, #656d76) 12%, transparent);
        border-color: var(--text-color-muted, #656d76);
      }
      .perm-toggle[aria-pressed="true"][data-risk="model"] {
        border-color: var(--kind-role);
        color: var(--kind-role);
        background: color-mix(in srgb, var(--kind-role) 12%, transparent);
      }
      .perm-toggle[aria-pressed="true"][data-risk="write"] {
        border-color: var(--kind-pipeline);
        color: var(--kind-pipeline);
        background: color-mix(in srgb, var(--kind-pipeline) 14%, transparent);
      }
      .perm-toggle[aria-pressed="true"][data-risk="push"] {
        border-color: var(--kind-pipeline);
        background: var(--kind-pipeline);
        color: var(--color-white, #ffffff);
      }
      .perm-toggle:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }

      /* Repos: a ranked list, because the first entry is where the branch lands. */
      .repos-value {
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .repos-value:hover .chip { border-color: var(--kind-repo); }
      .repos-value:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }
      .repo-chip--primary { border-color: var(--kind-repo); color: var(--kind-repo); }
      .repos-editor {
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
      }
      .repos-preview {
        display: grid;
        gap: var(--space-2);
        border-top: 1px solid var(--border-color-default, #d0d7de);
        padding-top: var(--space-2);
      }
      /* One level inside an assignment row, so the label column steps down. */
      .repos-editor .detail-row,
      .repos-preview .detail-row { grid-template-columns: 4rem 1fr; }
      .repos-editor .detail-value,
      .repos-preview .detail-value { min-width: 0; }
      .repo-known { display: grid; gap: var(--space-1); }
      .repo-row {
        display: grid;
        grid-template-columns: auto auto 1fr auto auto auto;
        gap: var(--space-2);
        align-items: center;
        padding: var(--space-2);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        min-width: 0;
      }
      .repo-known .repo-row { grid-template-columns: 1fr auto auto; }
      /* The landing repo, marked on the edge rather than by position alone. */
      .repo-row--primary { border-left: 4px solid var(--kind-repo); }
      .repo-row--broken {
        border-color: var(--outcome-failure);
        background: var(--finding-validation);
      }
      /* Not registered, so its access is unknown rather than known-wrong. */
      .repo-row--unknown {
        border-color: var(--kind-pipeline);
        background: var(--finding-advisory);
      }
      .repo-rank {
        width: 1.25rem;
        text-align: right;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-muted, #656d76);
      }
      .repo-name {
        min-width: 0;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Its own cell: the sentence explaining rank must not truncate with the name. */
      .repo-primary {
        min-width: 0;
        font-size: var(--text-code-inline, 12px);
        color: var(--kind-repo);
      }
      .repo-move { display: flex; gap: var(--space-1); }
      .access {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0 0.45rem;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);
        color: var(--text-color-muted, #656d76);
        white-space: nowrap;
      }
      /* Only these two can take a branch, so only these two carry a hue. */
      .access--push { border-color: var(--kind-repo); color: var(--kind-repo); }
      .access--pr { border-color: var(--kind-assignment); color: var(--kind-assignment); }
      .access--unknown { border-color: var(--kind-pipeline); color: var(--kind-pipeline); }
      .icon-btn {
        padding: 3px 6px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-muted, #656d76);
        font-size: var(--text-code-inline, 12px);
        line-height: 1;
        cursor: pointer;
      }
      .icon-btn:hover:not(:disabled) { border-color: var(--kind-assignment); color: var(--kind-assignment); }
      /* Fade the glyph, not the border: a bounded control is still a control. */
      .icon-btn:disabled { color: color-mix(in srgb, var(--text-color-muted, #656d76) 45%, transparent); cursor: default; }
      .icon-btn:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }

      /* Limits: a kill switch, so an uncapped one is never silent. */
      .limits-value {
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .limits-value:hover .chip { border-color: var(--kind-assignment); }
      .limits-value:hover .chip--off { border-color: var(--kind-pipeline); }
      .limits-value:hover .chip--none { border-color: var(--outcome-failure); }
      .limits-value:focus-visible {
        outline: 2px solid var(--color-focus-outline, #0969da);
        outline-offset: 2px;
      }
      /* Uncapped: dashed, because the value is absent rather than low. */
      .chip--off { border-style: dashed; border-color: var(--kind-pipeline); color: var(--kind-pipeline); }
      /* Nothing bounded at all, which "N unlimited" would understate. */
      .chip--none {
        border-color: var(--outcome-failure);
        background: var(--finding-validation);
        color: var(--outcome-failure);
      }
      .limits-editor {
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
      }
      .limit-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) 7rem auto;
        gap: var(--space-2);
        align-items: center;
        padding: var(--space-2);
        border: 1px solid var(--border-color-default, #d0d7de);

      .switch {

      .switch[aria-pressed="true"] {

        outline-offset: 2px;

      .limits-dirty {

      }

      .flow-card--agent { --accent: var(--kind-agent); }
      .flow-card--decision { --accent: var(--kind-decision); }

      .flow-handle {

      .flow-handle--failure { --handle-color: var(--outcome-failure); }
      .flow-handle--blocked { --handle-color: var(--outcome-blocked); }
      .flow-handle--no-work { --handle-color: var(--outcome-no-work); }
      .flow-handle--data { --handle-color: var(--relation-data); }
      .flow-handle--observes { --handle-color: var(--relation-observes); }
      .flow-handle--loop { --handle-color: var(--outcome-failure); }

      .react-flow__edge-path { stroke-width: 2.4; }
      .flow-edge--success .react-flow__edge-path { stroke: var(--outcome-success); }
      .flow-edge--failure .react-flow__edge-path { stroke: var(--outcome-failure); }
      .flow-edge--blocked .react-flow__edge-path { stroke: var(--outcome-blocked); }
      .flow-edge--no-work .react-flow__edge-path { stroke: var(--outcome-no-work); }
      .flow-edge--data .react-flow__edge-path { stroke: var(--relation-data); stroke-dasharray: 7 5; }
      .flow-edge--observes .react-flow__edge-path { stroke: var(--relation-observes); stroke-dasharray: 2 5; }

      .edge-caption {
        position: absolute;
        padding: 0;
        color: var(--text-color-muted, #656d76);

        letter-spacing: 0.01em;

          0 1px 0 var(--background-color-default, #ffffff),

      .react-flow__minimap { background: var(--background-color-default, #ffffff); border: 1px solid var(--border-color-default, #d0d7de); }
      .react-flow__controls { box-shadow: none; border: 1px solid var(--border-color-default, #d0d7de); }
      .react-flow__controls-button { background: var(--background-color-default, #ffffff); border-bottom-color: var(--border-color-default, #d0d7de); color: var(--text-color-default, #1f2328); }
      .react-flow__background { color: var(--border-color-default, #d0d7de); }

      .side-panel {
        display: grid;
        align-content: start;
        gap: var(--space-4);
        padding: var(--space-4);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);

      }

      .panel-section {

      }

      .legend-swatch {
        display: inline-block;
        width: 1.25rem;

      }

      .legend-swatch--data { border-top: 2px dashed var(--relation-data); background: transparent; }
      .legend-swatch--observes { border-top: 2px dotted var(--relation-observes); background: transparent; }

      .has-highlight .card, .has-highlight .step-badge { opacity: 0.35; }
      .has-highlight .is-highlighted, .flow-card.is-highlighted { opacity: 1; outline: 2px solid var(--color-focus-outline, #0969da); outline-offset: 3px; }

      /* graph-overlays: live/replay mode UI and run-event overlay states. */
      .mode-switcher { display: flex; gap: 0; margin-left: var(--space-4); border: 1px solid var(--border-color-default, #d0d7de); border-radius: 999px; overflow: hidden; }
      .mode-tab { border: 0; padding: var(--space-1) var(--space-3); background: var(--background-color-default, #ffffff); color: var(--text-color-muted, #656d76); cursor: pointer; text-transform: capitalize; }
      .mode-tab--active { background: var(--color-focus-outline, #0969da); color: #ffffff; }
      .run-picker { max-width: 22rem; border: 1px solid var(--border-color-default, #d0d7de); border-radius: 6px; background: var(--background-color-default, #ffffff); color: inherit; font: inherit; }
      .run-controls, .replay-controls, .replay-timeline { display: flex; align-items: center; gap: var(--space-2); }
      .run-control { border: 1px solid var(--border-color-default, #d0d7de); border-radius: 6px; padding: 3px 10px; background: var(--background-color-default, #ffffff); color: inherit; cursor: pointer; }
      .run-control--active { border-color: var(--color-focus-outline, #0969da); color: var(--color-focus-outline, #0969da); }

      .member-list ul { margin: 0; padding-left: 0; list-style: none; }

      .member-row--success { color: var(--outcome-success); }
      .member-row--failure { color: var(--outcome-failure); }

      .fallback-shell {

        margin: var(--space-5);
        padding: var(--space-5);

        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }

      .fallback-error {
        white-space: pre-wrap;
        color: var(--outcome-failure);
      }

      .fallback-state {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: var(--space-2) var(--space-3);

        color: var(--text-color-muted, #656d76);
      }

      .fallback-state dd {
        margin: 0;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = document.querySelector("#root");
      let renderedFallback = false;
      let lastError = null;

      window.addEventListener("error", (event) => {
        lastError = event.error ?? event.message;
        void showFallback(lastError);
      });
      window.addEventListener("unhandledrejection", (event) => {
        lastError = event.reason;
        void showFallback(lastError);
      });
      window.addEventListener("bureau-mounted", () => {
        window.__bureauCanvasMounted = true;
      });

      setTimeout(() => {
        if (!window.__bureauCanvasMounted) {
          void showFallback(lastError ?? new Error("Renderer did not mount before timeout."));
        }
      }, 2500);

      try {
        await import("./app.mjs");
      } catch (error) {
        lastError = error;
        await showFallback(error);
      }

      async function showFallback(error) {
        if (window.__bureauCanvasMounted || renderedFallback) {
          return;
        }
        renderedFallback = true;
        const state = await loadState();
        root.replaceChildren(fallbackView(error, state));
      }

      async function loadState() {
        try {
          const response = await fetch("./state", { cache: "no-store" });
          return response.ok ? response.json() : { status: `State request failed: ${response.status}` };
        } catch (error) {
          return { status: "State unavailable", validation: { message: String(error) } };
        }
      }

      function fallbackView(error, state) {
        const shell = document.createElement("main");
        shell.className = "fallback-shell";
        shell.append(heading(), errorText(error), stateList(state));
        return shell;
      }

      function heading() {
        const block = document.createElement("div");
        const title = document.createElement("h1");
        const copy = document.createElement("p");
        title.textContent = "Bureau renderer could not start";
        copy.className = "muted";
        copy.textContent = "The config data is still available below. Check whether the CDN, proxy, or import map blocked the renderer modules.";
        block.append(title, copy);
        return block;
      }

      function errorText(error) {
        const message = document.createElement("p");
        message.className = "fallback-error";
        message.textContent = error?.stack || error?.message || String(error);
        return message;
      }

      function stateList(state) {
        const list = document.createElement("dl");
        list.className = "fallback-state";
        addPair(list, "Status", state.status ?? state.validation?.state ?? "unknown");
        addPair(list, "Config dir", state.validation?.dir ?? state.dir ?? "unknown");
        addPair(list, "Validation", state.validation?.message ?? `${state.validation?.errors?.length ?? state.validation?.errors ?? 0} errors`);
        addPair(list, "Assignments", String(state.config?.view?.assignments?.length ?? 0));
        addPair(list, "Pipelines", String(state.config?.view?.pipelines?.length ?? 0));
        return list;
      }

      function addPair(list, label, value) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = label;
        detail.textContent = value;
        list.append(term, detail);
      }
    </script>
  </body>

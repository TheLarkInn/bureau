<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bureau</title>
    <!-- Module URLs are pinned here; keep the stylesheet version below in lockstep because CSS links cannot use import-map aliases. -->

    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.mjs",

    </script>
    <style>
      :root {
        color-scheme: light dark;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --radius: 0.625rem;
        --card-width: 15rem;
        --kind-work-source: var(--text-color-muted, #656d76);
        --kind-assignment: var(--true-color-blue, #0969da);
        --kind-role: var(--true-color-purple, #8250df);
        --kind-repo: var(--true-color-green, #1a7f37);
        --kind-pipeline: var(--true-color-yellow, #9a6700);
        --kind-deterministic: var(--true-color-blue, #0969da);
        --kind-agent: var(--true-color-purple, #8250df);
        --kind-decision: var(--true-color-yellow, #9a6700);
        --kind-concurrent: var(--true-color-green, #1a7f37);
        --kind-terminal: var(--text-color-muted, #656d76);
        --outcome-success: var(--true-color-green, #1a7f37);
        --outcome-failure: var(--true-color-red, #cf222e);
        --outcome-blocked: var(--true-color-yellow, #9a6700);
        --outcome-no-work: var(--text-color-muted, #656d76);
        --relation-data: var(--true-color-blue, #0969da);
        --relation-observes: var(--true-color-purple, #8250df);
        --finding-validation: var(--true-color-red-muted, #ffebe9);
        --finding-advisory: var(--true-color-yellow-muted, #fff8c5);
      }

      body {
        margin: 0;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: var(--text-body-medium, 14px);
        line-height: var(--leading-body-medium, 20px);
      }

      button { font: inherit; }

      h1, h2, h3, p { margin: 0; }

      h1 {
        font-size: 1.25rem;
        line-height: 1.5rem;
        font-weight: 700;
      }

      h2 {
        font-size: 1rem;
        line-height: 1.25rem;
        font-weight: 700;
      }

      h3 {
        font-size: 0.78rem;
        line-height: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-color-muted, #656d76);
        font-weight: 700;
      }

      code, .mono {
        font-family: var(--font-mono, "SFMono-Regular", Consolas, "Liberation Mono", monospace);
        font-size: var(--text-code-inline, 12px);
      }

      .app-shell {
        /* Flex rather than fixed grid rows: the draft bar appears and
           disappears, and a fixed `1fr` row stretched whichever child landed
           in it. */
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--background-color-default, #ffffff);
      }

      .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;        gap: var(--space-5);
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--border-color-default, #d0d7de);
      }

      .summary, .muted, .detail {
        color: var(--text-color-muted, #656d76);
      }

      .status {
        display: grid;
        gap: var(--space-1);
        max-width: 40rem;
        text-align: right;
        color: var(--text-color-muted, #656d76);
      }

      .findings, .chips, .step-list, .legend {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      /* Chips carry names that can be long; clip with an ellipsis rather than
         letting them run past the card the layout reserved room for. */
      .chips > *, .step-list > * {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .create-bar, .draft-bar {
        margin-left: var(--space-5);
        margin-right: var(--space-5);
      }

      .general-findings {
        padding: var(--space-3) var(--space-5) 0;
      }

      .chip, .finding, .step-badge, .legend-item {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        background: var(--background-color-default, #ffffff);
        color: var(--text-color-default, #1f2328);
        white-space: nowrap;
      }

      .finding--validation { background: var(--finding-validation); }
      .finding--advisory { background: var(--finding-advisory); }

      .view-shell {
        display: grid;
        gap: var(--space-4);
        padding: var(--space-5);
        flex: 1 1 auto;
        min-height: 0;
      }

      .view-shell--pipeline {
        grid-template-columns: minmax(50rem, 1fr) 19rem;
        min-height: 0;
      }

      .surface {
        position: relative;
        min-height: 42rem;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        overflow: auto;
      }

      .config-surface {
        min-width: max-content;
      }

      .edge-layer, .card-layer {
        position: absolute;
        inset: 0;
      }

      .edge-layer { pointer-events: none; }

      .edge-path {
        fill: none;
        stroke: var(--border-color-default, #d0d7de);
        stroke-width: 2;
      }

      .card, .flow-card {
        box-sizing: border-box;
        display: grid;
        gap: var(--space-2);
        width: var(--card-width);
        min-height: 7rem;
        padding: var(--space-3);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-top: 4px solid var(--accent, var(--kind-terminal));
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        box-shadow: 0 10px 24px rgba(31, 35, 40, 0.08);
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 240px;
        overflow: hidden;
      }
      .card > div,
      .card > .card-button {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      /* Same surface as the pipeline view: pan, zoom, fit, minimap. */
      .config-flow {
        min-height: 44rem;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
        overflow: hidden;
      }
      /* A pending change must not look like saved state. */
      .draft-bar {
        margin: 0 0 12px;
        padding: 10px 14px;
        border: 1px dashed var(--true-color-orange, #cca700);
        border-radius: 8px;
        background: var(--background-color-default, #fff);

      .draft-bar p {
        margin: 0 0 6px;

      .draft-list {
        margin: 0 0 8px;
        padding-left: 18px;
        color: var(--text-color-muted, #656d76);
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);

      .draft-actions button,
      .create-bar button,
      .card-action,
      .preflight button {

        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        color: var(--text-color-default, #1f2328);

        font-size: var(--text-code-inline, 12px);
        line-height: 1.4;
        cursor: pointer;
      }
      .draft-actions button:hover,
      .create-bar button:hover,
      .card-action:hover,
      .preflight button:hover {
        border-color: var(--text-color-muted, #656d76);
      }
      .draft-actions button + button,
      .preflight button + button {
        margin-left: 6px;

      .card-action {
        align-self: flex-end;
        flex: 0 0 auto;
        margin: 6px 0 0;
        color: var(--text-color-muted, #656d76);
      }
      .create-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
      }
      .create-bar select,
      .create-bar input {
        height: 30px;
        padding: 4px 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        color: var(--text-color-default, #1f2328);
        font: inherit;
      }
      .card-action {

        margin: 8px 0 0 auto;
        font-size: var(--text-code-inline, 12px);
      }
      .preflight {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 6px;
        background: var(--background-color-default, #fff);
        font-size: var(--text-code-inline, 12px);

      .preflight--blocking {
        border-color: var(--true-color-red, #cf222e);

      .preflight ul {
        margin: 4px 0 8px;
        padding-left: 16px;

      }
      .severity-entry-step {

      .card-button, .step-button, .back-button {
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .back-button {
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: 999px;
        padding: var(--space-1) var(--space-3);
        background: var(--background-color-default, #ffffff);
      }

      .card-button, .step-button {
        display: grid;
        gap: var(--space-2);
        width: 100%;

      }

      .card-button:focus-visible, .step-button:focus-visible, .back-button:focus-visible, .permission-chip:focus-visible {

        outline-offset: 2px;
      }

      .card--work-source { --accent: var(--kind-work-source); }
      .card--assignment { --accent: var(--kind-assignment); }
      .card--role { --accent: var(--kind-role); }
      .card--repo { --accent: var(--kind-repo); }
      .card--pipeline { --accent: var(--kind-pipeline); }
      .card--orphan { outline: 1px dashed var(--border-color-default, #d0d7de); outline-offset: 4px; }

      .kind-label {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-color-muted, #656d76);

      .detail {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

      /* The detail is a button so a long value is readable, not just hinted at

      .detail-toggle {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .detail-toggle:hover,
      .detail-toggle:focus-visible {
        color: var(--text-color-default, #1f2328);
        text-decoration: underline dotted;
      }
      .detail-toggle--open {
        overflow: visible;
        white-space: normal;
        word-break: break-word;
        font-family: var(--font-mono, monospace);
        font-size: var(--text-code-inline, 12px);

      /* An expanded card grows past its reserved box and floats above the rest

      .card--expanded {
        height: auto;
        overflow: visible;
        box-shadow: 0 8px 24px rgb(0 0 0 / 28%);

      .card--expanded > div,
      .card--expanded > .card-button {
        overflow: visible;
      }

      .pipeline-main {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: var(--space-3);
        min-width: 0;
      }

      .pipeline-toolbar {
        display: flex;
        align-items: center;
        gap: var(--space-3);

      .pipeline-toolbar .editor-link {

        font-size: 0.85rem;
      }

      .pipeline-flow {
        min-height: 44rem;
        border: 1px solid var(--border-color-default, #d0d7de);

        background: var(--background-color-default, #ffffff);

      .flow-card--deterministic { --accent: var(--kind-deterministic); }
      .flow-card--agent { --accent: var(--kind-agent); }
      .flow-card--decision { --accent: var(--kind-decision); }
      .flow-card--concurrent { --accent: var(--kind-concurrent); }

      .flow-handle {

      .flow-handle--success { --handle-color: var(--outcome-success); }
      .flow-handle--failure { --handle-color: var(--outcome-failure); }
      .flow-handle--blocked { --handle-color: var(--outcome-blocked); }
      .flow-handle--no-work { --handle-color: var(--outcome-no-work); }
      .flow-handle--data { --handle-color: var(--relation-data); }
      .flow-handle--observes { --handle-color: var(--relation-observes); }
      .flow-handle--loop { --handle-color: var(--outcome-failure); }

      .react-flow__edge-path { stroke-width: 2.4; }
      .flow-edge--success .react-flow__edge-path { stroke: var(--outcome-success); }
      .flow-edge--failure .react-flow__edge-path { stroke: var(--outcome-failure); }
      .flow-edge--blocked .react-flow__edge-path { stroke: var(--outcome-blocked); }
      .flow-edge--no-work .react-flow__edge-path { stroke: var(--outcome-no-work); }
      .flow-edge--data .react-flow__edge-path { stroke: var(--relation-data); stroke-dasharray: 7 5; }
      .flow-edge--observes .react-flow__edge-path { stroke: var(--relation-observes); stroke-dasharray: 2 5; }

      .edge-caption {
        position: absolute;
        padding: 0;
        color: var(--text-color-muted, #656d76);
        font: 700 0.72rem/1 var(--font-mono, SFMono-Regular, Consolas, monospace);
        letter-spacing: 0.01em;
        text-shadow:
          0 1px 0 var(--background-color-default, #ffffff),
          1px 0 0 var(--background-color-default, #ffffff),
          0 -1px 0 var(--background-color-default, #ffffff),
          -1px 0 0 var(--background-color-default, #ffffff);
        pointer-events: none;
      }

      .react-flow__minimap { background: var(--background-color-default, #ffffff); border: 1px solid var(--border-color-default, #d0d7de); }
      .react-flow__controls { box-shadow: none; border: 1px solid var(--border-color-default, #d0d7de); }
      .react-flow__controls-button { background: var(--background-color-default, #ffffff); border-bottom-color: var(--border-color-default, #d0d7de); color: var(--text-color-default, #1f2328); }
      .react-flow__background { color: var(--border-color-default, #d0d7de); }

      .side-panel {
        display: grid;
        align-content: start;
        gap: var(--space-4);
        padding: var(--space-4);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }

      .panel-section {
        display: grid;
        gap: var(--space-2);
      }

      .legend-swatch {
        display: inline-block;
        width: 1.25rem;
        height: 0.25rem;
        border-radius: 999px;
        background: var(--swatch, var(--border-color-default, #d0d7de));
        vertical-align: middle;
      }

      .legend-swatch--data { border-top: 2px dashed var(--relation-data); background: transparent; }
      .legend-swatch--observes { border-top: 2px dotted var(--relation-observes); background: transparent; }

      .has-highlight .card, .has-highlight .step-badge { opacity: 0.35; }
      .has-highlight .is-highlighted, .flow-card.is-highlighted { opacity: 1; outline: 2px solid var(--color-focus-outline, #0969da); outline-offset: 3px; }

      .mode-switcher { display: flex; gap: 0; margin-left: var(--space-4); border: 1px solid var(--border-color-default, #d0d7de); border-radius: 999px; overflow: hidden; }
      .mode-tab { border: 0; padding: var(--space-1) var(--space-3); background: var(--background-color-default, #ffffff); color: var(--text-color-muted, #656d76); cursor: pointer; text-transform: capitalize; }
      .mode-tab--active { background: var(--color-focus-outline, #0969da); color: #ffffff; }
      .run-picker { max-width: 22rem; border: 1px solid var(--border-color-default, #d0d7de); border-radius: 6px; background: var(--background-color-default, #ffffff); color: inherit; font: inherit; }
      .run-controls, .replay-controls, .replay-timeline { display: flex; align-items: center; gap: var(--space-2); }
      .run-control { border: 1px solid var(--border-color-default, #d0d7de); border-radius: 6px; padding: 3px 10px; background: var(--background-color-default, #ffffff); color: inherit; cursor: pointer; }
      .run-control--active { border-color: var(--color-focus-outline, #0969da); color: var(--color-focus-outline, #0969da); }
      .run-control--danger { color: var(--outcome-failure); }
      .run-control-error { color: var(--outcome-failure); font-size: var(--text-code-inline, 12px); }

      .overlay-failure { --accent: var(--outcome-failure); }

      .overlay-no-work { --accent: var(--outcome-no-work); }
      .paused-badge { margin-left: var(--space-2); padding: 0 var(--space-2); border: 1px solid var(--outcome-blocked); border-radius: 999px; color: var(--outcome-blocked); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }

      .member-row { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-code-inline, 12px); }
      .member-row--success { color: var(--outcome-success); }
      .member-row--failure { color: var(--outcome-failure); }
      .member-row--blocked { color: var(--outcome-blocked); }
      .member-row--running { color: var(--color-focus-outline, #0969da); }
      .member-collapse { border: 0; padding: 0; background: none; color: var(--text-color-muted, #656d76); font-size: var(--text-code-inline, 12px); cursor: pointer; text-align: left; }
      .react-flow__edge.animated .react-flow__edge-path { stroke-dasharray: 8 6; animation: overlay-edge-flow 0.8s linear infinite; }
      @keyframes overlay-edge-flow { to { stroke-dashoffset: -14; } }

      .fallback-shell {
        display: grid;
        gap: var(--space-4);
        max-width: 52rem;
        margin: var(--space-5);
        padding: var(--space-5);
        border: 1px solid var(--border-color-default, #d0d7de);
        border-radius: var(--radius);
        background: var(--background-color-default, #ffffff);
      }

      .fallback-error {
        white-space: pre-wrap;
        color: var(--outcome-failure);
      }

      .fallback-state {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: var(--space-2) var(--space-3);
      }

      .fallback-state dt {
        color: var(--text-color-muted, #656d76);
      }

      .fallback-state dd {
        margin: 0;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = document.querySelector("#root");
      let renderedFallback = false;
      let lastError = null;

      window.addEventListener("error", (event) => {
        lastError = event.error ?? event.message;
        void showFallback(lastError);
      });
      window.addEventListener("unhandledrejection", (event) => {
        lastError = event.reason;
        void showFallback(lastError);
      });
      window.addEventListener("bureau-mounted", () => {
        window.__bureauCanvasMounted = true;
      });

      setTimeout(() => {
        if (!window.__bureauCanvasMounted) {
          void showFallback(lastError ?? new Error("Renderer did not mount before timeout."));
        }
      }, 2500);

      try {
        await import("./app.mjs");
      } catch (error) {
        lastError = error;
        await showFallback(error);
      }

      async function showFallback(error) {
        if (window.__bureauCanvasMounted || renderedFallback) {
          return;
        }
        renderedFallback = true;
        const state = await loadState();
        root.replaceChildren(fallbackView(error, state));
      }

      async function loadState() {
        try {
          const response = await fetch("./state", { cache: "no-store" });
          return response.ok ? response.json() : { status: `State request failed: ${response.status}` };
        } catch (error) {
          return { status: "State unavailable", validation: { message: String(error) } };
        }
      }

      function fallbackView(error, state) {
        const shell = document.createElement("main");
        shell.className = "fallback-shell";
        shell.append(heading(), errorText(error), stateList(state));
        return shell;
      }

      function heading() {
        const block = document.createElement("div");
        const title = document.createElement("h1");
        const copy = document.createElement("p");
        title.textContent = "Bureau renderer could not start";
        copy.className = "muted";
        copy.textContent = "The config data is still available below. Check whether the CDN, proxy, or import map blocked the renderer modules.";
        block.append(title, copy);
        return block;
      }

      function errorText(error) {
        const message = document.createElement("p");
        message.className = "fallback-error";
        message.textContent = error?.stack || error?.message || String(error);
        return message;
      }

      function stateList(state) {
        const list = document.createElement("dl");
        list.className = "fallback-state";
        addPair(list, "Status", state.status ?? state.validation?.state ?? "unknown");
        addPair(list, "Config dir", state.validation?.dir ?? state.dir ?? "unknown");
        addPair(list, "Validation", state.validation?.message ?? `${state.validation?.errors?.length ?? state.validation?.errors ?? 0} errors`);
        addPair(list, "Assignments", String(state.config?.view?.assignments?.length ?? 0));
        addPair(list, "Pipelines", String(state.config?.view?.pipelines?.length ?? 0));
        return list;
      }

      function addPair(list, label, value) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = label;
        detail.textContent = value;
        list.append(term, detail);
      }
    </script>
  </body>
</html>

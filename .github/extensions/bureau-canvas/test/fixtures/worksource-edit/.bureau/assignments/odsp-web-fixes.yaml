name: odsp-web-fixes
work:
  forge: github
  source: TheLarkInn/bureau
  # A narrow filter keeps the loop from claiming the whole backlog at once.
  filter: is:open label:agent-eligible
  abort_label: bureau:failed
  escalate_label: bureau:needs-human
repos:
- bureau
pipeline: agent-eligible-pipeline
role: implementer
verify: cargo test --offline
branch_prefix: bureau/
limits:
  max_concurrent: 1

name: Release binaries

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4.0.4
        with:
          node-version: 24
      - name: Install native musl compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes musl-tools
      # The process contract uses unprivileged PID namespaces. Ubuntu's
      # AppArmor default otherwise prevents those tests on hosted runners.
      - name: Enable process isolation on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Fetch locked build dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo fetch --locked
      - name: Run offline unit and integration tests on this architecture
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --offline --target "$TARGET"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --offline --release --bin bureau --target "$TARGET"
      - name: Package and smoke-test the archive
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh "$TARGET" "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: bureau-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

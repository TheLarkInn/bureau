name: Canvas state matrix

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Exhaustive UI state coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/extensions/bureau-canvas/e2e/playwright
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.0.4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/extensions/bureau-canvas/e2e/playwright/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render every modeled state
        run: npm run test:matrix
      - name: Report differences
        if: failure()
        run: |
          echo "### ❌ Modeled Canvas states did not render as the registry expects" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **canvas-state-gallery** for the render of every state and the failing report." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload state gallery
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: canvas-state-gallery
          path: |
            .github/extensions/bureau-canvas/e2e/gallery/
            .github/extensions/bureau-canvas/e2e/playwright/playwright-report/
          retention-days: 7

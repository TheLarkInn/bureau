name: Rust lints

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install lint tools
        run: |
          cargo install cargo-dylint --version 5.0.0 --locked
          cargo install dylint-link --version 5.0.0 --locked
          rustup toolchain install nightly-2026-01-22 --component rustc-dev
      - name: Check repository policy
        run: ./scripts/check-rust-policy.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run custom lints
        # `-A module-dependencies-dead-edge`: the dead-edge check runs per
        # crate, so in a lib+bin package every lib-internal edge reads as
        # dead in the bin crate. The allowlist itself stays fully enforced
        # (unlisted and undeclared edges remain deny-level errors).
        run: >-
          LIBRARY_PATH="$(rustc +nightly-2026-01-22 --print sysroot)/lib"
          RUSTFLAGS="-Dwarnings -A module-dependencies-dead-edge" cargo dylint --all

name: Rust lints

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4.0.4
        with:
          node-version: 24
      - name: Install lint tools
        run: |
          cargo install cargo-dylint --version 5.0.0 --locked
          cargo install dylint-link --version 5.0.0 --locked
          rustup toolchain install nightly-2026-01-22 --component rustc-dev
      # The canvas suite validates its scaffolds by running the real
      # `bureau validate --json`. Without a binary those tests skip, so build
      # one here rather than lose the coverage.
      - name: Build bureau for the canvas tests
        run: cargo build --bin bureau
      # Browser tests for the assignment card controls. `lint.sh` skips them
      # when node_modules is absent, so install here to keep them enforced.
      - name: Install canvas browser test dependencies
        working-directory: .github/extensions/bureau-canvas/e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The canvas pause tests run the real Engine, including its isolated
      # Git subprocesses, just like the native binary test jobs.
      - name: Enable process isolation on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run all lint gates
        run: |
          cargo fmt --all
          git diff --exit-code
          bash scripts/lint.sh
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: playwright-report
          path: .github/extensions/bureau-canvas/e2e/playwright/playwright-report/
          retention-days: 7

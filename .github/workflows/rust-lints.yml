name: Rust lints

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install lint tools
        run: |
          cargo install cargo-dylint --version 5.0.0 --locked
          cargo install dylint-link --version 5.0.0 --locked
          rustup toolchain install nightly-2026-01-22 --component rustc-dev
      - name: Check repository policy
        run: ./scripts/check-rust-policy.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run custom lints
        run: >-
          LIBRARY_PATH="$(rustc +nightly-2026-01-22 --print sysroot)/lib"
          RUSTFLAGS="-Dwarnings
          -Aacyclic_modules
          -Ablocking_in_async
          -Adebug_remnants
          -Aglobal_side_effect_env
          -Aglobal_side_effect_logging_init
          -Aglobal_side_effect_randomness
          -Aglobal_side_effect_time
          -Amodule_dependencies
          -Amodule_dependencies_dead_edge
          -Amodule_dependencies_unlisted
          -Aproper_error_type
          -Asuggest_builder"
          cargo dylint --all

name: Rust lints

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install lint tools
        run: |
          cargo install cargo-dylint --version 5.0.0 --locked
          cargo install dylint-link --version 5.0.0 --locked
          rustup toolchain install nightly-2026-01-22 --component rustc-dev
      - name: Check repository policy
        run: ./scripts/check-rust-policy.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run custom lints
        # The pinned bundle includes advisory architecture lints outside
        # the hard gates in AGENTS.md. Enforce the ordering lint here.
        run: >-
          LIBRARY_PATH="$(rustc +nightly-2026-01-22 --print sysroot)/lib"
          RUSTFLAGS="-Awarnings
          -Dtopological_ordering
          -Aacyclic_modules
          -Ablocking_in_async
          -Amodule_dependencies
          -Amodule_dependencies_dead_edge
          -Amodule_dependencies_unlisted"
          cargo dylint --all

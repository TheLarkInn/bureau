name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Release-plz PR number to validate and merge; empty checks/releases main"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.release_pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      base: ${{ steps.source.outputs.base }}
      release_pr: ${{ steps.source.outputs.release_pr }}
      recover_release: ${{ steps.source.outputs.recover_release }}
    steps:
      # Dispatch and privileged jobs use automation from main, never from
      # the release PR they are about to validate.
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/github-script@v7.0.1
        id: source
        with:
          script: |
            const { source } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-pr.mjs`);
            await source({ github, context, core });

  lint:
    needs: source
    uses: ./.github/workflows/rust-lints.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  matrix:
    needs: source
    uses: ./.github/workflows/canvas-state-matrix.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  visual:
    needs: source
    uses: ./.github/workflows/canvas-visual-regression.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  binaries:
    needs: source
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  checks:
    name: All checks passed
    if: always()
    needs: [source, lint, matrix, visual, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = Object.values(JSON.parse(process.env.RESULTS));
            if (!jobs.every(job => job.result === "success")) process.exit(1);
          '
      # A workflow_dispatch run belongs to main's SHA even though its jobs
      # tested the release head. Report that exact head for branch protection.
      - name: Report release-head check
        if: always() && needs.source.outputs.release_pr != ''
        uses: actions/github-script@v7.0.1
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ needs.source.outputs.sha }}
        with:
          script: |
            const success = Object.values(JSON.parse(process.env.RESULTS))
              .every(job => job.result === "success");
            await github.rest.checks.create({
              ...context.repo, name: "All checks passed",
              head_sha: process.env.TESTED_SHA, status: "completed",
              conclusion: success ? "success" : "failure",
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  merge-release:
    if: github.event_name == 'workflow_dispatch' && needs.source.outputs.release_pr != ''
    needs: [source, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/github-script@v7.0.1
        env:
          RELEASE_PR: ${{ needs.source.outputs.release_pr }}
          TESTED_SHA: ${{ needs.source.outputs.sha }}
          TESTED_BASE: ${{ needs.source.outputs.base }}
        with:
          script: |
            const { merge } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-pr.mjs`);
            await merge({
              github, context, number: process.env.RELEASE_PR,
              sha: process.env.TESTED_SHA, base: process.env.TESTED_BASE,
            });

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source.outputs.release_pr == ''
    needs: [source, checks]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      ref: ${{ needs.source.outputs.sha }}
      recover_release: ${{ needs.source.outputs.recover_release == 'true' }}

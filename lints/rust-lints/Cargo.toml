[package]
name = "rust-lints"
version = "0.1.0"
edition = "2024"
description = "Custom Rust lints via the dylint ecosystem"
license = "MIT OR Apache-2.0"

# Vendored from https://github.com/li-kai/rust-lints @ 3e4427e (MIT OR Apache-2.0).
# Local patch: module_dependencies dead-edge detection skips source modules
# absent from the crate being linted, so one workspace-wide dylint.toml can
# serve crates with distinct module graphs.

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "54482290b5f32e6c6b57cc9e0a17153f432b0036" }
dylint_linting = "5.0.0"
serde = { version = "1", features = ["derive"] }

[package.metadata.rust-analyzer]
rustc_private = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("rust_lints"))'] }

# Standalone workspace: the bureau workspace must not absorb the lint crate.
[workspace]

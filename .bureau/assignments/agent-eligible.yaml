name: agent-eligible
work:
  forge: github
  source: TheLarkInn/bureau
  filter: is:open label:agent-eligible
  approval_label: null
repos:
- bureau
pipeline: agent-eligible-pipeline
role: implementer
# `timeout_kills_the_whole_process_group` is a layer-0 test that asserts a
# backgrounded grandchild dies with its process group. Bureau runs this
# command inside its own process-group supervisor, so the test's kill
# semantics nest inside the very mechanism it is checking, and it fails
# here while passing standalone. Skip it in automation; CI and developers
# still run the whole suite.
verify: cargo test --offline -- --skip timeout_kills_the_whole_process_group
branch_prefix: bureau/
limits:
  max_concurrent: 1
  max_runs_per_hour: 4
  max_runs_per_day: null
  max_open_prs: null
  # Cost accounting is not measured by the copilot adapter yet (issue
  # 18); a daily cost limit would block every run on unmeasurable usage.
  max_cost_per_day_usd: null
  max_run_hours: null

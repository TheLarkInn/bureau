name: ui-design-review
work:
  forge: github
  source: TheLarkInn/bureau
  filter: is:open label:ui-change
  approval_label: null
  abort_label: bureau:failed
  escalate_label: bureau:needs-human
repos:
- bureau
pipeline: design-review
role: design-reviewer
# Visual-testing evidence for the audit: the canvas e2e harness renders the
# graph UI headlessly and writes screenshots the visual-auditor inspects.
verify: node .github/extensions/bureau-canvas/e2e/run.mjs
branch_prefix: bureau/
limits:
  max_concurrent: 1
  max_runs_per_hour: 2
  max_runs_per_day: 8
  max_open_prs: null
  max_cost_per_day_usd: null
  max_run_hours: null

name: maintenance-site-accessibility
work:
  forge: github
  source: TheLarkInn/bureau
  filter: 'is:issue is:open label:"bureau:maintenance-site-accessibility" label:"bureau:maintenance-ready" -label:"bureau:maintenance-reported" -label:"bureau:maintenance-failed" -label:"bureau:maintenance-needs-human" -label:agent-eligible -label:"bureau:design-scan"'
  approval_label: bureau:maintenance-ready
  abort_label: bureau:maintenance-failed
  escalate_label: bureau:maintenance-needs-human
repos: [bureau]
pipeline: maintenance-site-accessibility
role: maintenance-site-accessibility-fixer
verify: cargo fmt --all -- --check && bash scripts/lint.sh && cargo test --offline
branch_prefix: bureau/maintenance-site-accessibility/
limits:
  max_concurrent: 1
  max_runs_per_hour: 2
  max_runs_per_day: 6
  max_open_prs: 2
  max_cost_per_day_usd: 10
  max_run_hours: 1

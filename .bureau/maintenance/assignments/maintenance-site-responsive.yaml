name: maintenance-site-responsive
work:
  forge: github
  source: TheLarkInn/bureau
  filter: 'is:issue is:open label:"bureau:maintenance-site-responsive" label:"bureau:maintenance-ready" -label:"bureau:maintenance-reported" -label:"bureau:maintenance-failed" -label:"bureau:maintenance-needs-human" -label:agent-eligible -label:"bureau:design-scan"'
  approval_label: bureau:maintenance-ready
  abort_label: bureau:maintenance-failed
  escalate_label: bureau:maintenance-needs-human
repos: [bureau]
pipeline: maintenance-site-responsive
role: maintenance-site-responsive-fixer
verify: cargo fmt --all -- --check && bash scripts/lint.sh && cargo test --offline
branch_prefix: bureau/maintenance-site-responsive/
limits:
  max_concurrent: 1
  max_run_hours: 1

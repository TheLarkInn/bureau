[Unit]
RefuseManualStart=yes
BindsTo=bureau-windows-heartbeat.service
After=bureau-windows-heartbeat.service

[Service]
Restart=no
TimeoutStartSec=30s
TimeoutStopSec=5s
TimeoutStopFailureMode=kill
KillMode=mixed
SendSIGKILL=yes
FinalKillSignal=SIGKILL
ExecStartPre=/usr/bin/env -i PATH=/opt/bureau/rust/bin:/opt/bureau/bin:/usr/local/bin:/usr/bin:/bin INVOCATION_ID=${INVOCATION_ID} node /opt/bureau/source/deployment/supervision/claim.mjs

[Install]
WantedBy=

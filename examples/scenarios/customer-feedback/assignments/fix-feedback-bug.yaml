name: fix-feedback-bug
work:
  forge: github
  source: example-org/example-repo
  filter: "is:issue is:open label:feedback-bug label:agent-eligible -label:bureau:failed -label:bureau:needs-human"
  approval_label: bureau:fix-approved
  abort_label: bureau:failed
  escalate_label: bureau:needs-human
repos: [code]
pipeline: fix-feedback-bug
role: implementer
verify: "cargo test --offline"
branch_prefix: bureau/feedback-fix/
limits:
  max_concurrent: 1
  max_runs_per_hour: 2
  max_runs_per_day: 4
  max_open_prs: 2
  max_cost_per_day_usd: 10
  max_run_hours: 1

name: failing-test-repair
work:
  forge: github
  source: example-org/example-repo
  filter: "is:issue is:open label:failing-test -label:bureau:failed -label:bureau:needs-human"
  approval_label: bureau:approved
  abort_label: bureau:failed
  escalate_label: bureau:needs-human
repos: [code]
pipeline: failing-test-repair
role: repairer
verify: "cargo test --offline"
branch_prefix: bureau/test-repair/
limits:
  max_concurrent: 1
  max_runs_per_hour: 2
  max_runs_per_day: 4
  max_open_prs: 2
  max_cost_per_day_usd: 10
  max_run_hours: 1

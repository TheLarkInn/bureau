[package]
name = "bureau"
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
# The official ACP client requires 1.88; the other crates retain the workspace MSRV.
rust-version = "1.88"
version.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bureau-lifecycle = { path = "../bureau-lifecycle", version = "0.1.1" }
bureau-plugin = { path = "../bureau-plugin", version = "0.1.1" }
bureau-dashboard = { path = "../../.github/extensions/bureau-canvas", version = "0.1.1" }
clap.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal"] }
ratatui.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bureau"
path = "src/main.rs"
